<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bizparkers Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: lead inbox. Stat strip on top, filter bar, list on the left, detail drawer on the right. */
:root{
  --paper:#FAF3E5; --card:#FFFCF5; --ink:#141414; --muted:#6A6253; --line:#E6DCC8;
  --orange:#FF4D00; --yellow:#FFC72E; --blue:#0A66FF; --green:#15A34A; --grey:#8A8375;
  --f-display:"Bricolage Grotesque","Arial Black",Arial,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --bw:2px; --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.02em;line-height:1.05}
.wrap{max-width:1320px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;font-family:var(--f-display);font-weight:700;padding:.65rem 1.05rem;border:var(--bw) solid var(--ink);border-radius:999px;background:var(--card);cursor:pointer;box-shadow:3px 3px 0 var(--ink);text-decoration:none;color:var(--ink);transition:transform .15s, box-shadow .15s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn--orange{background:var(--orange);color:#fff}
.btn--ink{background:var(--ink);color:var(--paper)}
.btn svg{width:17px;height:17px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--card);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px var(--gr) 24px var(--gl);background-image:radial-gradient(rgba(20,20,20,.13) 1.4px,transparent 1.4px);background-size:24px 24px}
.login-card{width:min(420px,100%);background:var(--card);border:var(--bw) solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);padding:32px;display:grid;gap:16px}
.login-card img{height:36px;width:auto}
.login-card h1{font-size:2rem;text-transform:uppercase}
.login-card p{margin:0;color:var(--muted)}
.input{width:100%;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:14px;padding:.8rem 1rem;font-size:1rem}
.input:focus{outline:none;box-shadow:4px 4px 0 var(--orange)}
.err{color:#C0261A;font-weight:600;font-size:.9rem;margin:0}
.hint{font-size:.85rem;color:var(--muted)}

/* app shell */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:var(--bw) solid var(--ink);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;height:68px}
.top img{height:30px;width:auto}
.top .tag{font-family:var(--f-mono);font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--yellow);padding:.3rem .6rem;border-radius:999px}
.top .spacer{flex:1}
.top .synced{font-size:.82rem;color:var(--muted)}
.demo{background:var(--yellow);border-bottom:var(--bw) solid var(--ink);font-weight:600;font-size:.92rem}
.demo .wrap{padding-block:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo a{color:var(--ink)}
main{padding-block:24px 60px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.head h1{font-size:clamp(2rem,4vw,3rem);text-transform:uppercase}
.head h1 span{color:var(--orange)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:var(--bw) solid var(--ink);border-radius:18px;padding:16px 18px;display:grid;gap:4px}
.stat b{font-family:var(--f-display);font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-weight:600}
.stat small{color:var(--muted)}
.stat:nth-child(1){box-shadow:5px 5px 0 var(--ink)}
.stat:nth-child(2) b{color:var(--orange)}
.stat:nth-child(4) b{color:var(--green)}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1 1 260px;min-width:0}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:42px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:var(--bw) solid var(--ink);background:var(--card);border-radius:999px;padding:.45rem .85rem;font-weight:600;font-size:.88rem;cursor:pointer}
.chip i{font-style:normal;font-family:var(--f-mono);font-size:.72rem;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:0 .4rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] i{background:var(--yellow);color:var(--ink)}
select.input{width:auto;padding:.6rem .9rem;cursor:pointer}

/* list */
.list{background:var(--card);border:var(--bw) solid var(--ink);border-radius:20px;overflow:hidden}
.row{display:grid;grid-template-columns:110px minmax(0,1.3fr) 150px minmax(0,1.4fr) 120px 128px;gap:14px;align-items:center;padding:14px 18px;border-bottom:1.5px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:hover{background:color-mix(in srgb,var(--yellow) 18%,transparent)}
.row.head-row{cursor:default;background:var(--paper);font-family:var(--f-mono);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:var(--bw) solid var(--ink)}
.row.head-row:hover{background:var(--paper)}
.row:last-child{border-bottom:0}
.row.unread .who b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);margin-right:7px;vertical-align:middle}
.when{font-size:.85rem;color:var(--muted)}
.who{min-width:0}
.who b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone{font-family:var(--f-mono);font-size:.82rem}
.svcs{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.svcs span{font-size:.76rem;font-weight:600;padding:.15rem .5rem;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.budget{font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:.25rem .65rem;border-radius:999px;border:1.5px solid var(--ink);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-New{background:#FFE3D6;color:#B33600}
.s-Contacted{background:#DCE8FF;color:#0748B3}
.s-Proposal{background:#FFF0C2;color:#8A6200}
.s-Won{background:#D9F5E3;color:#0E7A37}
.s-Lost{background:#EDEAE3;color:#5F594C}
.empty{padding:56px 20px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty b{font-family:var(--f-display);font-size:1.4rem}
.empty span{color:var(--muted)}
@media (max-width:980px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who status" "svcs svcs" "meta meta";gap:8px}
  .row.head-row{display:none}
  .row .who{grid-area:who}.row .st{grid-area:status}.row .svcs{grid-area:svcs}
  .row .when,.row .phone,.row .budget{display:none}
  .row .meta{grid-area:meta;display:flex!important;gap:12px;font-size:.82rem;color:var(--muted)}
}
.meta{display:none}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:40;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:50;background:var(--card);border-left:var(--bw) solid var(--ink);display:flex;flex-direction:column;animation:slide .28s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.d-head{padding:20px 22px;border-bottom:var(--bw) solid var(--ink);display:grid;gap:10px;background:var(--paper)}
.d-head .x{display:flex;align-items:flex-start;gap:12px}
.d-head h2{font-size:1.7rem;flex:1;min-width:0;overflow-wrap:anywhere}
.d-head small{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.d-acts{display:flex;flex-wrap:wrap;gap:8px}
.d-body{flex:1;overflow-y:auto;padding:20px 22px;display:grid;gap:20px;align-content:start;scrollbar-width:thin}
.d-sec{display:grid;gap:10px}
.d-sec h3{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
dl{margin:0;display:grid;gap:0;border:var(--bw) solid var(--ink);border-radius:16px;overflow:hidden}
dl div{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;padding:10px 14px;border-bottom:1.5px solid var(--line)}
dl div:last-child{border-bottom:0}
dt{font-size:.82rem;color:var(--muted);font-weight:600}
dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.status-pick{display:flex;flex-wrap:wrap;gap:8px}
.status-pick button{cursor:pointer}
.status-pick button[aria-pressed="true"]{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px);outline:2px solid var(--ink)}
textarea.input{min-height:110px;resize:vertical}
.d-foot{padding:14px 22px;border-top:var(--bw) solid var(--ink);display:flex;gap:10px;justify-content:flex-end;background:var(--paper)}
@media (max-width:560px){ dl div{grid-template-columns:1fr;gap:2px} .d-head h2{font-size:1.4rem} }

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:.7rem 1.1rem;border-radius:999px;font-weight:600;box-shadow:4px 4px 0 var(--orange);animation:fade .2s}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (max-width:640px){
  .top .synced,.top .lbl,.top .tag{display:none}
  .top .wrap{gap:8px}
  .top .btn{padding:.55rem .7rem}
  .bar select.input{flex:1 1 140px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></g></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></g></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></g></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></g></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-call" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2Z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3 6.5 9 6.5 9-6.5"/></g></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2.5"/><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-8A2.5 2.5 0 0 0 3 5.5v8A2.5 2.5 0 0 0 5.5 16H8"/></g></symbol>
</defs></svg>

<!-- login -->
<section class="login" id="loginView">
  <form class="login-card" id="loginForm" novalidate>
    <img src="assets/logo-full.png" alt="Bizparkers" width="148" height="36">
    <h1>Admin</h1>
    <p>Sign in to see and manage your website enquiries.</p>
    <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="Admin password" aria-label="Admin password">
    <p class="err" id="loginErr" hidden></p>
    <button class="btn btn--orange" type="submit" id="loginBtn">Sign in</button>
    <p class="hint" id="demoHint" hidden>No Google Sheet is connected yet, so this opens with <b>example enquiries</b>. See <b>apps-script/SETUP.md</b> to connect yours.</p>
  </form>
</section>

<!-- app -->
<div id="appView" hidden>
  <header class="top">
    <div class="wrap">
      <img src="assets/logo-full.png" alt="Bizparkers" width="123" height="30">
      <span class="tag">Admin</span>
      <span class="spacer"></span>
      <span class="synced" id="synced"></span>
      <button class="icon-btn" type="button" id="refreshBtn" aria-label="Refresh"><svg><use href="#i-refresh"/></svg></button>
      <button class="btn" type="button" id="csvBtn"><svg><use href="#i-down"/></svg><span class="lbl">Export CSV</span></button>
      <button class="icon-btn" type="button" id="logoutBtn" aria-label="Sign out"><svg><use href="#i-out"/></svg></button>
    </div>
  </header>
  <div class="demo" id="demoBar" hidden><div class="wrap">Example data. Connect your Google Sheet to see real enquiries (apps-script/SETUP.md).</div></div>

  <main class="wrap">
    <div class="head">
      <h1>Your <span>enquiries</span></h1>
    </div>

    <div class="stats" id="stats"></div>

    <div class="bar">
      <label class="search"><svg><use href="#i-search"/></svg><input class="input" id="q" type="search" placeholder="Search name, phone, business, message" aria-label="Search enquiries"></label>
      <select class="input" id="svcFilter" aria-label="Filter by service"><option value="">All services</option></select>
      <select class="input" id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option></select>
    </div>
    <div class="chips" id="statusChips" style="margin-bottom:16px"></div>

    <div class="list" id="list"></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dName"></aside>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== Paste your Google Apps Script web app URL here (same as CONFIG.sheetUrl on the website) ===== */
const SHEET_URL = "";

(function(){
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const STATUSES = ["New", "Contacted", "Proposal sent", "Won", "Lost"];
  const demo = !SHEET_URL;
  let key = "", rows = [], filter = "All", openId = null;

  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const cls = s => "s-" + String(s || "New").split(" ")[0];
  const fmt = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("en-IN", { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }); };
  const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); if (m < 60) return m + "m ago"; const h = Math.round(m / 60); if (h < 24) return h + "h ago"; return Math.round(h / 24) + "d ago"; };
  const toast = msg => { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); };
  const store = { get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };

  const api = async body => {
    const r = await fetch(SHEET_URL, { method: "POST", body: JSON.stringify({ ...body, key }) });
    if (!r.ok) throw new Error("Network error");
    return r.json();
  };

  /* example rows for demo mode only */
  const sample = () => {
    const now = Date.now(), h = 3600e3;
    return [
      { "Enquiry ID": "BP-DEMO1", "Received": new Date(now - 2 * h).toISOString(), "Status": "New", "Name": "Example: Rahul Verma", "Phone": "+91 98xxxxxx10", "Email": "rahul@example.com", "Looking for": "Website, Google SEO", "Budget": "₹25,000 to ₹75,000", "About the business": "Bakery in Pune. Want a website with online orders and more customers from Google.", "Business name": "Sample Sweets", "Has a website": "No", "Website": "-", "Monthly ad spend": "Not running ads", "Wants to improve": "More leads and enquiries, Ranking on Google", "Notes": "" },
      { "Enquiry ID": "BP-DEMO2", "Received": new Date(now - 26 * h).toISOString(), "Status": "Contacted", "Name": "Example: Priya Nair", "Phone": "+91 97xxxxxx21", "Email": "", "Looking for": "Mobile app", "Budget": "Above ₹2,00,000", "About the business": "Fitness studio chain, need a booking app for members.", "Notes": "Call booked for Friday 11am." },
      { "Enquiry ID": "BP-DEMO3", "Received": new Date(now - 3 * 24 * h).toISOString(), "Status": "Proposal sent", "Name": "Example: Aman Gupta", "Phone": "+91 99xxxxxx32", "Email": "aman@example.com", "Looking for": "AI chatbot, AI automation", "Budget": "₹75,000 to ₹2,00,000", "About the business": "Real estate agency. Too many WhatsApp leads to answer by hand.", "Notes": "Sent quote for bot + CRM sync." },
      { "Enquiry ID": "BP-DEMO4", "Received": new Date(now - 6 * 24 * h).toISOString(), "Status": "Won", "Name": "Example: Neha Shah", "Phone": "+91 96xxxxxx43", "Email": "neha@example.com", "Looking for": "Logo & branding, Website", "Budget": "₹25,000 to ₹75,000", "About the business": "New skincare brand launching next month.", "Notes": "Advance received." },
      { "Enquiry ID": "BP-DEMO5", "Received": new Date(now - 9 * 24 * h).toISOString(), "Status": "Lost", "Name": "Example: Karan Mehta", "Phone": "+91 95xxxxxx54", "Email": "", "Looking for": "Digital marketing", "Budget": "Under ₹25,000", "About the business": "Clothing store, wants Instagram ads.", "Notes": "Budget too low for now." }
    ];
  };

  /* ---------- login ---------- */
  const enter = () => { $("#loginView").hidden = true; $("#appView").hidden = false; $("#demoBar").hidden = !demo; render(); };
  const load = async () => {
    if (demo) { rows = rows.length ? rows : sample(); return; }
    const j = await api({ action: "list" });
    if (!j.ok) throw new Error(j.error || "Could not load");
    rows = j.rows || [];
  };
  $("#demoHint").hidden = !demo;
  if (demo) $("#pw").placeholder = "Any password (demo)";
  $("#loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    key = $("#pw").value; const err = $("#loginErr"), btn = $("#loginBtn");
    if (!key) { err.textContent = "Enter your admin password."; err.hidden = false; return; }
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Signing in';
    try { await load(); store.set("bp_admin", key); enter(); $("#synced").textContent = "Updated just now"; }
    catch (ex) { err.textContent = ex.message === "Wrong password" ? "That password is wrong. Try again." : "Couldn't reach your Google Sheet. Check SHEET_URL and your connection."; err.hidden = false; }
    btn.disabled = false; btn.textContent = "Sign in";
  });
  $("#logoutBtn").addEventListener("click", () => { store.set("bp_admin", null); key = ""; rows = []; $("#pw").value = ""; closeDrawer(); $("#appView").hidden = true; $("#loginView").hidden = false; });
  $("#refreshBtn").addEventListener("click", async () => {
    const b = $("#refreshBtn"); b.innerHTML = '<span class="spin"></span>';
    try { await load(); render(); $("#synced").textContent = "Updated just now"; toast("Enquiries refreshed"); } catch (ex) { toast("Couldn't refresh. Check your connection."); }
    b.innerHTML = '<svg><use href="#i-refresh"/></svg>';
  });

  /* ---------- render ---------- */
  const visible = () => {
    const q = $("#q").value.trim().toLowerCase(), svc = $("#svcFilter").value;
    let out = rows.filter(r => (filter === "All" || (r.Status || "New") === filter) && (!svc || String(r["Looking for"]).includes(svc)) &&
      (!q || ["Name", "Phone", "Email", "Business name", "About the business", "Looking for", "Notes"].some(k => String(r[k] || "").toLowerCase().includes(q))));
    out.sort((a, b) => new Date(b.Received) - new Date(a.Received));
    if ($("#sort").value === "old") out.reverse();
    return out;
  };

  const render = () => {
    const week = Date.now() - 7 * 864e5;
    const count = s => rows.filter(r => (r.Status || "New") === s).length;
    const won = count("Won"), closed = won + count("Lost");
    $("#stats").innerHTML = [
      [rows.length, "Total enquiries", "All time"],
      [count("New"), "New", "Waiting for a reply"],
      [rows.filter(r => new Date(r.Received) > week).length, "This week", "Last 7 days"],
      [won, "Won", closed ? Math.round(won / closed * 100) + "% of closed deals" : "No closed deals yet"]
    ].map(([n, l, s]) => `<div class="stat"><b>${n}</b><span>${l}</span><small>${s}</small></div>`).join("");

    $("#statusChips").innerHTML = ["All", ...STATUSES].map(s =>
      `<button class="chip" type="button" data-s="${s}" aria-pressed="${s === filter}">${s}<i>${s === "All" ? rows.length : count(s)}</i></button>`).join("");

    const svcs = [...new Set(rows.flatMap(r => String(r["Looking for"] || "").split(",").map(x => x.trim()).filter(Boolean)))].sort();
    const cur = $("#svcFilter").value;
    $("#svcFilter").innerHTML = '<option value="">All services</option>' + svcs.map(s => `<option${s === cur ? " selected" : ""}>${esc(s)}</option>`).join("");

    const list = visible();
    $("#list").innerHTML = list.length ? `<div class="row head-row"><span>Received</span><span>Name</span><span>Phone</span><span>Looking for</span><span>Budget</span><span>Status</span></div>` +
      list.map(r => `<button class="row${(r.Status || "New") === "New" ? " unread" : ""}" type="button" data-id="${esc(r["Enquiry ID"])}">
        <span class="when" title="${esc(fmt(r.Received))}">${esc(ago(r.Received))}</span>
        <span class="who"><b>${esc(r.Name)}</b><small>${esc(r["Business name"] || r["About the business"] || "")}</small></span>
        <span class="phone">${esc(r.Phone)}</span>
        <span class="svcs">${String(r["Looking for"] || "").split(",").filter(Boolean).map(s => `<span>${esc(s.trim())}</span>`).join("")}</span>
        <span class="budget">${esc(r.Budget || "")}</span>
        <span class="st"><span class="pill ${cls(r.Status)}">${esc(r.Status || "New")}</span></span>
        <span class="meta"><span>${esc(ago(r.Received))}</span><span>${esc(r.Phone)}</span><span>${esc(r.Budget || "")}</span></span>
      </button>`).join("")
      : `<div class="empty"><b>${rows.length ? "No matches" : "No enquiries yet"}</b><span>${rows.length ? "Try a different search or filter." : "New enquiries from your website will show up here."}</span></div>`;
  };

  $("#statusChips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; filter = c.dataset.s; render(); });
  ["#q", "#svcFilter", "#sort"].forEach(s => $(s).addEventListener("input", render));
  $("#list").addEventListener("click", e => { const r = e.target.closest(".row[data-id]"); if (r) openDrawer(r.dataset.id); });

  /* ---------- detail drawer ---------- */
  const FIELDS = ["Phone", "Email", "Looking for", "Budget", "About the business", "Business name", "Has a website", "Website", "Monthly ad spend", "Wants to improve"];
  const openDrawer = id => {
    const r = rows.find(x => x["Enquiry ID"] === id); if (!r) return;
    openId = id;
    const digits = String(r.Phone || "").replace(/[^\d+]/g, "");
    const d = $("#drawer");
    d.innerHTML = `
      <div class="d-head">
        <div class="x"><h2 id="dName">${esc(r.Name)}</h2><button class="icon-btn" type="button" id="dClose" aria-label="Close"><svg><use href="#i-x"/></svg></button></div>
        <small>${esc(r["Enquiry ID"])} · received ${esc(fmt(r.Received))}</small>
        <div class="d-acts">
          ${digits ? `<a class="btn btn--ink" href="tel:${esc(digits)}"><svg><use href="#i-call"/></svg>Call</a>` : ""}
          ${r.Email ? `<a class="btn" href="mailto:${esc(r.Email)}?subject=${encodeURIComponent("Your enquiry with Bizparkers")}"><svg><use href="#i-mail"/></svg>Email</a>` : ""}
          <button class="btn" type="button" id="dCopy"><svg><use href="#i-copy"/></svg>Copy phone</button>
        </div>
      </div>
      <div class="d-body">
        <div class="d-sec"><h3>Status</h3><div class="status-pick">${STATUSES.map(s => `<button type="button" class="pill ${cls(s)}" data-s="${s}" aria-pressed="${(r.Status || "New") === s}">${s}</button>`).join("")}</div></div>
        <div class="d-sec"><h3>Enquiry</h3><dl>${FIELDS.filter(f => r[f] && r[f] !== "-" && r[f] !== "Not given" && r[f] !== "Not shared" && r[f] !== "Not answered").map(f => `<div><dt>${f}</dt><dd>${esc(r[f])}</dd></div>`).join("")}</dl></div>
        <div class="d-sec"><h3>Notes</h3><textarea class="input" id="dNotes" placeholder="Call notes, next steps, quote sent…">${esc(r.Notes || "")}</textarea></div>
      </div>
      <div class="d-foot"><button class="btn" type="button" id="dCancel">Close</button><button class="btn btn--orange" type="button" id="dSave">Save changes</button></div>`;
    let status = r.Status || "New";
    $$(".status-pick button", d).forEach(b => b.addEventListener("click", () => { status = b.dataset.s; $$(".status-pick button", d).forEach(x => x.setAttribute("aria-pressed", x === b)); }));
    $("#dClose").onclick = $("#dCancel").onclick = closeDrawer;
    $("#dCopy").onclick = () => { try { navigator.clipboard.writeText(r.Phone).then(() => toast("Phone number copied"), () => toast(r.Phone)); } catch (e) { toast(r.Phone); } };
    $("#dSave").onclick = async () => {
      const btn = $("#dSave"), notes = $("#dNotes").value;
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving';
      try {
        if (!demo) { const j = await api({ action: "update", id, status, notes }); if (!j.ok) throw new Error(j.error); }
        r.Status = status; r.Notes = notes; render(); closeDrawer(); toast(demo ? "Saved (demo only)" : "Saved to your sheet");
      } catch (e) { btn.disabled = false; btn.textContent = "Save changes"; toast("Couldn't save. Try again."); }
    };
    d.hidden = false; $("#scrim").hidden = false; document.body.style.overflow = "hidden";
    $("#dClose").focus();
  };
  function closeDrawer(){ $("#drawer").hidden = true; $("#scrim").hidden = true; document.body.style.overflow = ""; openId = null; }
  $("#scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && openId) closeDrawer(); });

  /* ---------- CSV export ---------- */
  $("#csvBtn").addEventListener("click", () => {
    const cols = ["Enquiry ID", "Received", "Status", "Name", "Phone", "Email", ...FIELDS.slice(2), "Notes"];
    const cell = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
    const csv = [cols.map(cell).join(","), ...visible().map(r => cols.map(c => cell(r[c])).join(","))].join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
    a.download = "bizparkers-enquiries-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  });

  /* keep signed in for this browser tab */
  const saved = store.get("bp_admin");
  if (saved) { key = saved; load().then(() => { enter(); $("#synced").textContent = "Updated just now"; }).catch(() => store.set("bp_admin", null)); }
  setInterval(() => { if (!$("#appView").hidden && !demo && !openId && !document.hidden) load().then(() => { render(); $("#synced").textContent = "Updated " + new Date().toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }); }).catch(() => {}); }, 60000);
})();
</script>
</body>
</html>
