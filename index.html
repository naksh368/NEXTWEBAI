<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXTWEB — Student Practice Portal</title>
</head><body>

<style>
:root{
  --ground:#0B1020;
  --panel:#141C33;
  --panel-2:#1B2543;
  --edge:rgba(160,180,235,.16);
  --ink:#EDF1FB;
  --ink-2:#A3B0D0;
  --ink-3:#6E7C9F;
  --marigold:#F5A524;
  --indigo:#6C7BFF;
  --mint:#34D399;
  --rose:#FF6B8B;
  --shadow:0 26px 60px -22px rgba(0,0,0,.85);
  --r:18px;
  --ease:cubic-bezier(.22,1,.36,1);
  --back:cubic-bezier(.34,1.56,.64,1);
  --display:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root{
    --ground:#FBF7EF; --panel:#FFFFFF; --panel-2:#F4EFE4;
    --edge:rgba(30,40,70,.14);
    --ink:#171C2E; --ink-2:#4C566F; --ink-3:#7C87A0;
    --indigo:#4E5CE0; --marigold:#C97C06;
    --shadow:0 20px 44px -24px rgba(30,40,70,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1020; --panel:#141C33; --panel-2:#1B2543;
  --edge:rgba(160,180,235,.16);
  --ink:#EDF1FB; --ink-2:#A3B0D0; --ink-3:#6E7C9F;
  --marigold:#F5A524; --indigo:#6C7BFF;
  --shadow:0 26px 60px -22px rgba(0,0,0,.85);
}
:root[data-theme="light"]{
  --ground:#FBF7EF; --panel:#FFFFFF; --panel-2:#F4EFE4;
  --edge:rgba(30,40,70,.14);
  --ink:#171C2E; --ink-2:#4C566F; --ink-3:#7C87A0;
  --indigo:#4E5CE0; --marigold:#C97C06;
  --shadow:0 20px 44px -24px rgba(30,40,70,.4);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.55;overflow-x:hidden}
button{font:inherit;color:inherit}

.glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;filter:blur(80px);opacity:.42}
.glow b{position:absolute;display:block;border-radius:50%}
.glow b:nth-child(1){width:44vw;height:44vw;left:-10vw;top:-12vh;background:radial-gradient(circle,var(--indigo),transparent 62%);animation:d1 24s var(--ease) infinite alternate}
.glow b:nth-child(2){width:36vw;height:36vw;right:-8vw;top:20vh;background:radial-gradient(circle,var(--marigold),transparent 60%);animation:d2 30s var(--ease) infinite alternate}
.glow b:nth-child(3){width:40vw;height:40vw;left:30vw;bottom:-20vh;background:radial-gradient(circle,var(--mint),transparent 64%);animation:d3 27s var(--ease) infinite alternate}
@keyframes d1{to{transform:translate3d(12vw,10vh,0) scale(1.2)}}
@keyframes d2{to{transform:translate3d(-10vw,14vh,0) scale(1.14)}}
@keyframes d3{to{transform:translate3d(8vw,-12vh,0) scale(1.2)}}

.view{position:relative;z-index:1;display:none;min-height:100vh}
.view.on{display:block;animation:vIn .55s var(--ease) both}
@keyframes vIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- login ---------- */
.lwrap{min-height:100vh;display:grid;place-items:center;padding:28px 18px;perspective:1300px}
.lcard{width:min(420px,100%);padding:36px 30px 24px;background:var(--panel);border:1px solid var(--edge);
  border-radius:var(--r);box-shadow:var(--shadow);transform-style:preserve-3d;animation:cIn .8s var(--back) both}
@keyframes cIn{from{opacity:0;transform:translateY(38px) rotateX(14deg) scale(.94)}to{opacity:1;transform:none}}
.lcard.shake{animation:shk .45s var(--ease)}
@keyframes shk{20%,80%{transform:translateX(6px)}35%,65%{transform:translateX(-9px)}50%{transform:translateX(9px)}}
.mark{display:grid;place-items:center;height:76px;perspective:600px;margin-bottom:10px}
.cube{position:relative;width:46px;height:46px;transform-style:preserve-3d;animation:spin 15s linear infinite}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.cube i{position:absolute;inset:0;border:1px solid var(--marigold);border-radius:7px;
  background:linear-gradient(135deg,rgba(245,165,36,.28),rgba(108,123,255,.2))}
.cube i:nth-child(1){transform:translateZ(23px)}
.cube i:nth-child(2){transform:rotateY(180deg) translateZ(23px)}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(23px)}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(23px)}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(23px)}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(23px)}
.bname{font-family:var(--display);font-size:30px;letter-spacing:.02em;text-align:center;margin:0}
.bname em{font-style:normal;color:var(--marigold)}
.bsub{text-align:center;color:var(--ink-2);font-size:12.5px;margin:6px 0 26px;letter-spacing:.08em;text-transform:uppercase}
.f{position:relative;margin-bottom:14px}
.f input{width:100%;padding:16px 44px 16px 15px;border-radius:12px;background:var(--panel-2);
  border:1px solid var(--edge);color:var(--ink);outline:none;transition:border-color .22s,box-shadow .22s}
.f input:focus{border-color:var(--marigold);box-shadow:0 0 0 4px rgba(245,165,36,.16)}
.f label{position:absolute;left:15px;top:16px;color:var(--ink-3);pointer-events:none;transition:all .2s var(--ease)}
.f input:focus+label,.f input:not(:placeholder-shown)+label{top:-8px;left:11px;font-size:11px;padding:0 6px;
  background:var(--panel);color:var(--marigold);letter-spacing:.06em;text-transform:uppercase}
.eye{position:absolute;right:12px;top:13px;background:none;border:0;cursor:pointer;opacity:.6;font-size:15px}
.eye:hover{opacity:1}
.err{min-height:18px;margin:2px 0 8px;color:var(--rose);font-size:13px;text-align:center}
.hint{margin-top:18px;padding:11px;border-radius:11px;text-align:center;font-size:12.5px;color:var(--ink-2);
  background:var(--panel-2);border:1px dashed var(--edge)}
.hint b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--marigold);margin-bottom:4px}
.hint code{font-family:var(--mono);background:rgba(128,150,200,.16);padding:2px 7px;border-radius:6px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;
  border:1px solid var(--edge);background:transparent;cursor:pointer;font-weight:600;
  transition:transform .18s var(--back),box-shadow .22s,border-color .22s,background .22s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--marigold);outline-offset:3px}
.pri{background:var(--marigold);border-color:transparent;color:#20160A;box-shadow:0 12px 28px -14px rgba(245,165,36,.9)}
.pri:hover{filter:brightness(1.06)}
.gh{color:var(--ink-2)}
.gh:hover{color:var(--ink);border-color:var(--indigo);background:var(--panel-2)}
.blk{width:100%;padding:15px}
.sm{padding:7px 13px;font-size:13px;border-radius:10px}

/* ---------- chrome ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:13px 22px;
  background:color-mix(in srgb,var(--ground) 82%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--edge)}
.bar .lg{display:inline-flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;
  font-family:var(--display);font-size:17px}
.bar .lg em{font-style:normal;color:var(--marigold)}
.pip{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.3;transform:scale(.7)}}
.crumb{flex:1;display:flex;gap:7px;align-items:center;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.crumb button{background:var(--panel-2);border:1px solid var(--edge);border-radius:9px;padding:4px 10px;cursor:pointer;transition:.2s}
.crumb button:hover{color:var(--ink);border-color:var(--indigo)}
.crumb .now{color:var(--marigold)}
.who{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;font-size:13px;
  background:var(--panel-2);border:1px solid var(--edge)}

.stage{max-width:1080px;margin:0 auto;padding:38px 20px 70px}
.step{display:none}
.step.on{display:block;animation:sIn .5s var(--ease) both}
@keyframes sIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.head{text-align:center;margin-bottom:30px}
.head h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,4.4vw,40px);margin:0;text-wrap:balance}
.head h2 em{font-style:italic;color:var(--marigold)}
.head p{margin:8px 0 0;color:var(--ink-2);font-size:14px}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
.g-cls{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g-sub{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g-ch{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{position:relative;text-align:left;cursor:pointer;padding:20px;border-radius:var(--r);
  border:1px solid var(--edge);background:var(--panel);overflow:hidden;
  transition:transform .3s var(--ease),border-color .25s,box-shadow .3s;animation:pIn .45s var(--back) both}
@keyframes pIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-5px);border-color:var(--marigold);box-shadow:var(--shadow)}
.card:focus-visible{outline:2px solid var(--marigold);outline-offset:3px}
.card .ico{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;font-size:21px;margin-bottom:12px;
  background:var(--panel-2);border:1px solid var(--edge);transition:transform .3s var(--back)}
.card:hover .ico{transform:scale(1.1) rotate(-7deg)}
.card h3{margin:0 0 4px;font-size:16.5px;font-weight:650;line-height:1.35}
.card p{margin:0;color:var(--ink-2);font-size:13px}
.card .num{font-family:var(--display);font-size:42px;line-height:1;color:var(--marigold)}
.chip{position:absolute;top:14px;right:14px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--edge);color:var(--ink-3)}
.chip.live{color:var(--mint);border-color:color-mix(in srgb,var(--mint) 45%,transparent)}
.card.off{opacity:.45;cursor:not-allowed}
.card.off:hover{transform:none;border-color:var(--edge);box-shadow:none}
.ch{display:flex;gap:13px;align-items:flex-start;padding:17px}
.ch .n{flex:0 0 auto;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;font-family:var(--mono);
  font-size:13px;background:var(--panel-2);border:1px solid var(--edge);color:var(--marigold)}
.ch h3{font-size:14.5px}
.ch p{font-size:12px;color:var(--ink-3)}

/* ---------- test ---------- */
.thead{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.eb{margin:0 0 4px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--marigold)}
.thead h2{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(21px,3vw,29px)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;font-size:13px;
  background:var(--panel-2);border:1px solid var(--edge);color:var(--ink-2)}
.pill b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.prog{height:5px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin-bottom:24px}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--marigold),var(--indigo));transition:width .4s var(--ease)}
.qs{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.q{padding:20px;border-radius:var(--r);border:1px solid var(--edge);background:var(--panel);
  animation:pIn .4s var(--ease) both;transition:border-color .25s}
.q.done{border-color:color-mix(in srgb,var(--indigo) 45%,transparent)}
.q.right{border-color:color-mix(in srgb,var(--mint) 55%,transparent)}
.q.wrong{border-color:color-mix(in srgb,var(--rose) 55%,transparent)}
.qt{display:flex;gap:12px;margin-bottom:14px}
.qi{flex:0 0 auto;display:grid;place-items:center;width:29px;height:29px;border-radius:9px;font-family:var(--mono);
  font-size:12.5px;background:var(--panel-2);border:1px solid var(--edge)}
.qt p{margin:2px 0 0;font-size:15.5px;font-weight:600;line-height:1.5}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:11px;text-align:left;width:100%;padding:12px 15px;border-radius:12px;
  border:1px solid var(--edge);background:var(--panel-2);cursor:pointer;transition:all .2s var(--ease)}
.opt:hover{border-color:var(--indigo);transform:translateX(3px)}
.opt:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.opt .k{flex:0 0 auto;display:grid;place-items:center;width:25px;height:25px;border-radius:7px;font-family:var(--mono);
  font-size:12px;background:var(--panel);border:1px solid var(--edge);transition:.2s}
.opt .tx{font-size:14.5px}
.opt.pick{border-color:var(--indigo);background:color-mix(in srgb,var(--indigo) 16%,var(--panel-2))}
.opt.pick .k{background:var(--indigo);color:#fff;border-color:transparent}
.opt.ok{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 15%,var(--panel-2))}
.opt.ok .k{background:var(--mint);color:#06281B;border-color:transparent}
.opt.no{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 14%,var(--panel-2))}
.opt.no .k{background:var(--rose);color:#2C0710;border-color:transparent}
.opt .mk{margin-left:auto;font-size:14px}
.q.marked .opt{pointer-events:none;transform:none}
.note{margin:13px 0 0;padding:10px 13px;border-radius:10px;font-size:13px;color:var(--ink-2);
  background:var(--panel-2);border-left:3px solid var(--marigold)}
.note b{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-top:28px}

/* ---------- result ---------- */
.res{max-width:600px;margin:0 auto;padding:36px 28px 28px;text-align:center;border-radius:var(--r);
  border:1px solid var(--edge);background:var(--panel);box-shadow:var(--shadow)}
.ring{position:relative;width:190px;height:190px;margin:0 auto 18px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bgc{stroke:var(--panel-2)}
.ring .fgc{stroke:var(--marigold);stroke-dasharray:534;stroke-dashoffset:534;transition:stroke-dashoffset 1.1s var(--ease),stroke .4s}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center}
.ring .mid b{font-family:var(--mono);font-size:48px;font-weight:700;line-height:1}
.ring .mid span{font-size:13px;color:var(--ink-3)}
.res h2{font-family:var(--display);font-weight:400;font-size:27px;margin:0 0 6px}
.res .ln{margin:0 0 20px;color:var(--ink-2);font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:22px}
.st{padding:11px 17px;border-radius:12px;background:var(--panel-2);border:1px solid var(--edge);min-width:92px}
.st b{display:block;font-family:var(--mono);font-size:21px}
.st span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.st.g b{color:var(--mint)} .st.r b{color:var(--rose)} .st.y b{color:var(--marigold)}

.conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.conf i{position:absolute;width:8px;height:14px;animation:fall linear forwards}
@keyframes fall{0%{opacity:1;transform:translateY(-12vh) rotate(0)}100%{opacity:0;transform:translateY(106vh) rotate(720deg)}}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);z-index:80;padding:11px 20px;border-radius:99px;
  font-size:13.5px;background:var(--panel);border:1px solid var(--edge);box-shadow:var(--shadow);opacity:0;
  transition:all .3s var(--back);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;padding:20px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--edge)}

@media (max-width:720px){
  .bar{padding:11px 13px;gap:9px;flex-wrap:wrap}
  .crumb{order:3;flex-basis:100%}
  .stage{padding:26px 13px 60px}
  .ring{width:160px;height:160px}
  .ring .mid b{font-size:40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div class="glow" aria-hidden="true"><b></b><b></b><b></b></div>

<!-- LOGIN -->
<section id="vLogin" class="view on">
  <div class="lwrap">
    <div class="lcard" id="lcard">
      <div class="mark" aria-hidden="true"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <h1 class="bname">NEXT<em>WEB</em></h1>
      <p class="bsub">Student practice portal</p>
      <form id="loginForm" autocomplete="off">
        <div class="f">
          <input type="text" id="u" placeholder=" " required />
          <label for="u">Username</label>
        </div>
        <div class="f">
          <input type="password" id="p" placeholder=" " required />
          <label for="p">Passcode</label>
          <button class="eye" type="button" id="eye" aria-label="Show passcode">&#128065;</button>
        </div>
        <p class="err" id="err" role="alert"></p>
        <button class="btn pri blk" type="submit">Enter portal</button>
      </form>
      <div class="hint"><b>Test login</b><code>Naksh</code> &nbsp;&middot;&nbsp; <code>121212</code></div>
    </div>
  </div>
</section>

<!-- APP -->
<section id="vApp" class="view">
  <header class="bar">
    <button class="lg" id="home"><span class="pip"></span>NEXT<em>WEB</em></button>
    <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
    <span class="who" id="who"></span>
    <button class="btn gh sm" id="out" type="button">Log out</button>
  </header>

  <main class="stage">
    <div class="step" id="sClass">
      <div class="head"><h2>Choose your <em>class</em></h2><p>Classes 8 to 12 &middot; NCERT syllabus</p></div>
      <div class="grid g-cls" id="gClass"></div>
    </div>

    <div class="step" id="sSub">
      <div class="head"><h2>Pick a <em>subject</em></h2><p id="subP"></p></div>
      <div class="grid g-sub" id="gSub"></div>
      <div class="acts"><button class="btn gh" data-back="class" type="button">&larr; Classes</button></div>
    </div>

    <div class="step" id="sCh">
      <div class="head"><h2>Select a <em>chapter</em></h2><p id="chP"></p></div>
      <div class="grid g-ch" id="gCh"></div>
      <div class="acts"><button class="btn gh" data-back="sub" type="button">&larr; Subjects</button></div>
    </div>

    <div class="step" id="sTest">
      <div class="thead">
        <div><p class="eb" id="tEb"></p><h2 id="tT"></h2></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <span class="pill">&#9201; <b id="clock">00:00</b></span>
          <span class="pill"><b id="ansN">0</b>/20 answered</span>
        </div>
      </div>
      <div class="prog"><i id="bar"></i></div>
      <ol class="qs" id="qs"></ol>
      <div class="acts">
        <button class="btn pri" id="submit" type="button">Submit &amp; mark instantly</button>
        <button class="btn gh" id="reset" type="button">&#8635; Reset test</button>
        <button class="btn gh" data-back="ch" type="button">&larr; Chapters</button>
      </div>
    </div>

    <div class="step" id="sRes">
      <div class="res">
        <div class="ring">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle class="bgc" cx="100" cy="100" r="85"></circle>
            <circle class="fgc" cx="100" cy="100" r="85" id="ringFg"></circle>
          </svg>
          <div class="mid"><b id="scN">0</b><span>out of 20</span></div>
        </div>
        <h2 id="verdict"></h2>
        <p class="ln" id="resLine"></p>
        <div class="stats" id="stats"></div>
        <div class="acts">
          <button class="btn pri" id="review" type="button">Review answers</button>
          <button class="btn gh" id="retake" type="button">&#8635; Reset &amp; retake</button>
          <button class="btn gh" data-back="ch" type="button">Another chapter</button>
        </div>
      </div>
    </div>
  </main>
  <footer class="foot">NEXTWEB &middot; NCERT practice tests &middot; preview build</footer>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ tiny helpers ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fx=n=>{const r=Math.round(n*100)/100;return String(r);};

/* build a question: correct answer + candidate distractors */
function mk(q,ans,dis,note){
  ans=String(ans);
  const seen=new Set([ans]), out=[];
  (dis||[]).forEach(d=>{d=String(d);if(!seen.has(d)){seen.add(d);out.push(d);}});
  let k=1;
  while(out.length<3&&k<60){
    const n=parseFloat(ans);
    const v=isNaN(n)?ans+" (none of these)"+"".padEnd(k,"'"):fx(n+k*(k%2?1:-1)*(Math.abs(n)>20?R(2,9):1));
    if(!seen.has(v)){seen.add(v);out.push(v);}
    k++;
  }
  return {q:q,ans:ans,opts:shuf([ans,...out.slice(0,3)]),note:note||""};
}

   const f=x=>{let s=1;for(let i=2;i<=x;i++)s*=i;return s;};
   return P([
     mk(`How many terms are there in the expansion of (a + b)<sup>${n}</sup>?`,n+1,[n,n-1,2*n],`An expansion of degree n has n + 1 terms.`),
     mk(`In (a + b)<sup>${n}</sup>, the coefficient of the term a<sup>${n-r}</sup>b<sup>${r}</sup> is:`,f(n)/(f(r)*f(n-r)),[n*r,f(n),n+r],`Coefficient = <sup>${n}</sup>C<sub>${r}</sub> = ${f(n)/(f(r)*f(n-r))}.`),
     mk(`What is the sum of all binomial coefficients in (1 + x)<sup>${n}</sup>?`,Math.pow(2,n),[n*n,Math.pow(2,n)-1,2*n],`Putting x = 1 gives 2ⁿ = ${Math.pow(2,n)}.`)
   ]);},
 matrix(){const m=R(2,4),n=R(2,4),k=R(2,4);
   return P([
     mk(`A matrix of order ${m} × ${n} has how many elements?`,m*n,[m+n,m*m,n*n],`Elements = rows × columns = ${m*n}.`),
     mk(`If A is ${m}×${n} and B is ${n}×${k}, what is the order of AB?`,`${m} × ${k}`,[`${n} × ${m}`,`${k} × ${m}`,`${m} × ${n}`],`The product takes the rows of A and the columns of B: ${m}×${k}.`),
     mk("A square matrix A is symmetric if:","A' = A",["A' = −A","A² = A","A = 0"],"A symmetric matrix equals its own transpose.")
   ]);},
 det(){const a=R(-8,9),b=R(-8,9),c=R(-8,9),d=R(-8,9);const v=a*d-b*c;
   return P([
     mk(`Evaluate the determinant of [[${a}, ${b}], [${c}, ${d}]].`,v,[a*d+b*c,a*b-c*d,a+d],`|A| = ad − bc = ${a*d} − ${b*c} = ${v}.`),
     mk("If |A| = 0, the matrix A is called:","singular",["non-singular","symmetric","an identity matrix"],"A matrix with zero determinant is singular and has no inverse."),
     mk("For a square matrix A of order n, |kA| equals:","kⁿ |A|",["k |A|","n |A|","|A|"],"Each of the n rows contributes a factor of k.")
   ]);},
 deriv(){const n=R(2,7),k=R(2,9);
   const t=P([["x^"+n,`${n}x^${n-1}`],["sin x","cos x"],["cos x","−sin x"],["e^x","e^x"],["log x","1/x"],["tan x","sec²x"],[k+"x",String(k)]]);
   return P([
     mk(`Differentiate with respect to x:  ${t[0]}`,t[1],[`${n}x^${n}`,"1","x","0","−cos x","sec x tan x"],`d/dx (${t[0]}) = ${t[1]}.`),
     mk(`Evaluate: lim(x→2) of (x² − 4)/(x − 2)`,"4",["0","2","does not exist"],"Factorising gives x + 2, and at x = 2 the limit is 4."),
     mk("The derivative of a constant function is:","0",["1","the constant itself","undefined"],"A constant does not change, so its rate of change is 0.")
   ]);},
 integ(){const n=R(2,6),k=R(2,9);
   return P([
     mk(`Evaluate:  ∫ x<sup>${n}</sup> dx`,`x^${n+1}/${n+1} + C`,[`x^${n-1}/${n-1} + C`,`${n}x^${n-1} + C`,`x^${n+1} + C`],`∫xⁿ dx = xⁿ⁺¹/(n+1) + C.`),
     mk("Evaluate:  ∫ sin x dx","−cos x + C",["cos x + C","−sin x + C","sec x + C"],"The integral of sin x is −cos x + C."),
     mk("Evaluate:  ∫ (1/x) dx","log |x| + C",["1/x² + C","x log x + C","−1/x² + C"],"∫ dx/x = log|x| + C."),
     mk(`Evaluate the definite integral ∫₀<sup>${k}</sup> x dx.`,fx(k*k/2),[k*k,fx(k/2),fx(k*k)],`[x²/2]₀^${k} = ${k*k}/2 = ${fx(k*k/2)}.`)
   ]);},
 vect(){const a=[R(1,6),R(1,6),R(1,6)],b=[R(1,6),R(1,6),R(1,6)];
   const dot=a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
   const mag=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]);
   return P([
     mk(`Find the dot product of (${a.join("i + ")}k) and (${b.join("i + ")}k).`,dot,[a[0]*b[0],dot+2,fx(mag)],`Dot product = ${a[0]}×${b[0]} + ${a[1]}×${b[1]} + ${a[2]}×${b[2]} = ${dot}.`),
     mk(`Find the magnitude of the vector ${a[0]}i + ${a[1]}j + ${a[2]}k.`,fx(mag),[a[0]+a[1]+a[2],fx(mag*mag),fx(mag/2)],`|a| = √(${a[0]}²+${a[1]}²+${a[2]}²) = ${fx(mag)}.`),
     mk("Two non-zero vectors are perpendicular when their dot product is:","0",["1","their magnitude","−1"],"Perpendicular vectors have cos 90° = 0, so a·b = 0.")
   ]);},

   const a1=R(1,6),b1=R(1,6),a2=R(1,6),b2=R(1,6)+6;

     mk(`Solve:  ${a1}x + ${b1}y = ${c1}  and  ${a2}x + ${b2}y = ${c2}`,`x = ${x}, y = ${y}`,[`x = ${y}, y = ${x}`,`x = ${-x}, y = ${y}`,`x = ${x+1}, y = ${y-1}`],`Solving the pair gives x = ${x} and y = ${y}.`),

   ]);}
};

/* which chapters are playable */
function playable(id){return !!(MAP[id]||BANK[id]);}

/* build a 20-question test */
function buildTest(id){
  const out=[],seen=new Set();
  if(BANK[id]){
    shuf(BANK[id]).forEach(r=>{
      out.push({q:r[0],ans:r[1],opts:shuf([r[1],r[2],r[3],r[4]]),note:r[5]});
    });
  }
  if(MAP[id]){
    const gen=G[MAP[id]];
    let guard=0;
    while(out.length<20&&guard<600){
      guard++;
      const item=gen();
      if(seen.has(item.q))continue;
      seen.add(item.q);out.push(item);
    }
  }
  return out.slice(0,20);
}

/* ============ state ============ */
const S={cls:null,sub:null,ch:null,test:[],picks:[],marked:false,t0:0,timer:null};

/* ============ views ============ */
function show(v){$$(".view").forEach(x=>x.classList.remove("on"));$("#"+v).classList.add("on");}
function step(s){
  $$(".step").forEach(x=>x.classList.remove("on"));
  $("#"+s).classList.add("on");
  window.scrollTo({top:0,behavior:"smooth"});
  crumbs();
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2100);}

function crumbs(){
  const c=$("#crumb");c.innerHTML="";
  const add=(txt,fn)=>{const b=document.createElement("button");b.textContent=txt;b.onclick=fn;c.appendChild(b);};
  const sep=()=>{const s=document.createElement("span");s.textContent="›";s.style.opacity=".5";c.appendChild(s);};
  const now=t=>{const s=document.createElement("span");s.className="now";s.textContent=t;c.appendChild(s);};
  if(!S.cls)return;
  add("Class "+S.cls,()=>goSub(S.cls));
  if(S.sub){sep();add(SUB[S.sub].name,()=>goCh(S.cls,S.sub));}
  if(S.ch!==null){sep();now(SY[S.cls].subjects[S.sub][S.ch]);}
}

/* ---- class ---- */
function goClass(){
  S.cls=S.sub=null;S.ch=null;
  const g=$("#gClass");g.innerHTML="";
  Object.keys(SY).forEach((c,i)=>{
    const n=Object.values(SY[c].subjects).reduce((a,b)=>a+b.length,0);
    const b=document.createElement("button");
    b.className="card";b.style.animationDelay=(i*60)+"ms";
    b.innerHTML=`<div class="num">${c}</div><h3>Class ${c}</h3><p>${SY[c].blurb} &middot; ${n} chapters</p>`;
    b.onclick=()=>goSub(c);
    g.appendChild(b);
  });
  step("sClass");
}
/* ---- subject ---- */
function goSub(c){
  S.cls=c;S.sub=null;S.ch=null;
  $("#subP").textContent=`Class ${c} · NCERT syllabus`;
  const g=$("#gSub");g.innerHTML="";
  Object.keys(SY[c].subjects).forEach((k,i)=>{
    const list=SY[c].subjects[k];
    const ready=list.filter((_,j)=>playable(c+"-"+k+"-"+(j+1))).length;
    const b=document.createElement("button");
    b.className="card";b.style.animationDelay=(i*60)+"ms";
    b.innerHTML=`<span class="chip ${ready?"live":""}">${ready} of ${list.length} ready</span>
      <div class="ico">${SUB[k].icon}</div><h3>${SUB[k].name}</h3><p>${list.length} chapters</p>`;
    b.onclick=()=>goCh(c,k);
    g.appendChild(b);
  });
  step("sSub");
}
/* ---- chapter ---- */
function goCh(c,k){
  S.cls=c;S.sub=k;S.ch=null;
  $("#chP").textContent=`Class ${c} · ${SUB[k].name} · 20 questions per test`;
  const g=$("#gCh");g.innerHTML="";
  SY[c].subjects[k].forEach((name,i)=>{
    const id=c+"-"+k+"-"+(i+1), ok=playable(id);
    const b=document.createElement("button");
    b.className="card ch"+(ok?"":" off");
    b.style.animationDelay=Math.min(i*35,400)+"ms";
    b.innerHTML=`<span class="n">${i+1}</span><div><h3>${name}</h3>
      <p>${ok?"20-question test · instant marking":"Question bank coming soon"}</p></div>`;
    if(ok)b.onclick=()=>startTest(c,k,i); else b.disabled=true;
    g.appendChild(b);
  });
  step("sCh");
}

/* ---- test ---- */
function startTest(c,k,i){
  S.cls=c;S.sub=k;S.ch=i;
  S.test=buildTest(c+"-"+k+"-"+(i+1));
  S.picks=new Array(S.test.length).fill(null);
  S.marked=false;
  $("#tEb").textContent=`Class ${c} · ${SUB[k].name}`;
  $("#tT").textContent=SY[c].subjects[k][i];
  renderQs();
  startClock();
  step("sTest");
}
function renderQs(){
  const ol=$("#qs");ol.innerHTML="";
  S.test.forEach((q,qi)=>{
    const li=document.createElement("li");
    li.className="q";li.style.animationDelay=Math.min(qi*30,360)+"ms";
    li.innerHTML=`<div class="qt"><span class="qi">${qi+1}</span><p>${q.q}</p></div>`;
    const box=document.createElement("div");box.className="opts";
    q.opts.forEach((o,oi)=>{
      const btn=document.createElement("button");
      btn.className="opt";btn.type="button";
      btn.innerHTML=`<span class="k">${"ABCD"[oi]}</span><span class="tx">${o}</span>`;
      btn.onclick=()=>{
        if(S.marked)return;
        S.picks[qi]=o;
        [...box.children].forEach(c=>c.classList.remove("pick"));
        btn.classList.add("pick");
        li.classList.add("done");
        updateProgress();
      };
      box.appendChild(btn);
    });
    li.appendChild(box);
    ol.appendChild(li);
  });
  updateProgress();
}
function updateProgress(){
  const n=S.picks.filter(x=>x!==null).length;
  $("#ansN").textContent=n;
  $("#bar").style.width=(n/S.test.length*100)+"%";
}
function startClock(){
  clearInterval(S.timer);S.t0=Date.now();
  const tick=()=>{
    const s=Math.floor((Date.now()-S.t0)/1000);
    $("#clock").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  };
  tick();S.timer=setInterval(tick,1000);
}

/* ---- marking ---- */
function markAll(){
  if(S.marked)return;
  const blank=S.picks.filter(x=>x===null).length;
  if(blank && !confirm(`${blank} question${blank>1?"s are":" is"} still unanswered. Submit anyway?`))return;
  clearInterval(S.timer);
  S.marked=true;
  let score=0;
  $$("#qs .q").forEach((li,qi)=>{
    const q=S.test[qi],pick=S.picks[qi];
    li.classList.add("marked");
    const right=pick===q.ans;
    if(right)score++;
    li.classList.add(right?"right":"wrong");
    [...li.querySelectorAll(".opt")].forEach(btn=>{
      const txt=btn.querySelector(".tx").textContent;
      if(txt===q.ans){btn.classList.add("ok");btn.insertAdjacentHTML("beforeend",'<span class="mk">✓</span>');}
      else if(txt===pick){btn.classList.add("no");btn.insertAdjacentHTML("beforeend",'<span class="mk">✕</span>');}
      btn.classList.remove("pick");
    });
    if(q.note){
      const n=document.createElement("p");n.className="note";
      n.innerHTML=`<b>${right?"Correct.":"Answer: "+q.ans+"."}</b> ${q.note}`;
      li.appendChild(n);
    }
  });
  showResult(score);
}
function showResult(score){
  const total=S.test.length, pc=Math.round(score/total*100);
  const secs=Math.floor((Date.now()-S.t0)/1000);
  $("#scN").textContent=score;
  const ring=$("#ringFg"), C=2*Math.PI*85;
  ring.style.strokeDasharray=C;
  ring.style.strokeDashoffset=C;
  const col=pc>=75?"var(--mint)":pc>=40?"var(--marigold)":"var(--rose)";
  setTimeout(()=>{ring.style.strokeDashoffset=C*(1-score/total);ring.style.stroke=col;},120);
  $("#verdict").textContent=pc>=90?"Outstanding!":pc>=75?"Well done!":pc>=50?"Good effort":pc>=35?"Keep practising":"Needs revision";
  $("#resLine").textContent=`You scored ${score} out of ${total} (${pc}%) in ${Math.floor(secs/60)}m ${secs%60}s.`;
  $("#stats").innerHTML=
    `<div class="st g"><b>${score}</b><span>Correct</span></div>
     <div class="st r"><b>${S.picks.filter((p,i)=>p!==null&&p!==S.test[i].ans).length}</b><span>Wrong</span></div>
     <div class="st y"><b>${S.picks.filter(p=>p===null).length}</b><span>Skipped</span></div>
     <div class="st"><b>${pc}%</b><span>Score</span></div>`;
  step("sRes");
  if(pc>=75)confetti();
}
function confetti(){
  const w=document.createElement("div");w.className="conf";document.body.appendChild(w);
  const cols=["#F5A524","#6C7BFF","#34D399","#FF6B8B","#EDF1FB"];
  for(let i=0;i<70;i++){
    const p=document.createElement("i");
    p.style.left=Math.random()*100+"vw";
    p.style.background=P(cols);
    p.style.animationDuration=(2.2+Math.random()*1.8)+"s";
    p.style.animationDelay=(Math.random()*.7)+"s";
    w.appendChild(p);
  }
  setTimeout(()=>w.remove(),5200);
}
function resetTest(){
  S.picks=new Array(S.test.length).fill(null);
  S.marked=false;
  S.test=buildTest(S.cls+"-"+S.sub+"-"+(S.ch+1));
  renderQs();startClock();step("sTest");
  toast("Test reset — fresh questions loaded");
}

/* ============ events ============ */
$("#loginForm").addEventListener("submit",e=>{
  e.preventDefault();
  const u=$("#u").value.trim(), p=$("#p").value;
  if(u.toLowerCase()==="naksh"&&p==="121212"){
    $("#err").textContent="";
    $("#who").textContent="\u{1F393} "+u;
    show("vApp");goClass();
    toast("Welcome back, "+u);
  }else{
    $("#err").textContent="Wrong username or passcode. Try Naksh / 121212.";
    const c=$("#lcard");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
  }
});
$("#eye").onclick=()=>{const p=$("#p");p.type=p.type==="password"?"text":"password";};
$("#out").onclick=()=>{clearInterval(S.timer);$("#u").value="";$("#p").value="";show("vLogin");};
$("#home").onclick=goClass;
$("#submit").onclick=markAll;
$("#reset").onclick=resetTest;
$("#retake").onclick=resetTest;
$("#review").onclick=()=>{step("sTest");};
$$("[data-back]").forEach(b=>b.onclick=()=>{
  const t=b.dataset.back;
  if(t==="class")goClass();
  else if(t==="sub")goSub(S.cls);
  else goCh(S.cls,S.sub);
});
</script>
</body></html>
