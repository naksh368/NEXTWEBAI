<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Bizparkers</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Onest:wght@400;600&display=swap">
<style>
:root{--paper:#FAF3E5;--card:#FFFCF5;--ink:#141414;--muted:#5F584B;--orange:#FF4D00;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Onest","Segoe UI",system-ui,sans-serif;line-height:1.65;font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:40px}
header img{height:34px;width:auto}
a{color:var(--ink)}
h1,h2{font-family:"Bricolage Grotesque","Arial Black",Arial,sans-serif;line-height:1.05;letter-spacing:-.02em}
h1{font-size:clamp(2.2rem,6vw,3.6rem);text-transform:uppercase;margin:0 0 12px}
h1 span{color:var(--orange)}
h2{font-size:1.35rem;margin:32px 0 8px}
p,li{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:700;padding:.8rem 1.3rem;border:2px solid var(--ink);border-radius:999px;background:var(--orange);color:#fff;text-decoration:none;box-shadow:4px 4px 0 var(--ink)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:clamp(22px,4vw,40px);box-shadow:8px 8px 0 var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header><a href="/" aria-label="Bizparkers home"><img src="/assets/logo-full.webp" alt="Bizparkers" width="140" height="34"></a></header>
  <main class="card" style="text-align:center">
    <h1>4<span>0</span>4</h1>
    <p>This page doesn't exist, or it has moved.</p>
    <p style="margin-top:24px"><a class="btn" href="/">Go to the homepage</a></p>
  </main>
</div>
</body>
</html>
